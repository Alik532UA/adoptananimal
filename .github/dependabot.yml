# Updates arrive as pull requests, so the CI gates (check, lint, test, build,
# check:build, Lighthouse) run against them before anything is merged.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # One PR for the routine patch and minor bumps; majors stay separate so a
      # breaking change is never mixed with unrelated updates.
      dev-minor:
        dependency-type: development
        update-types: [minor, patch]
      prod-minor:
        dependency-type: production
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
