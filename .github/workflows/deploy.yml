name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'

      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run check
      - run: npm run check:i18n
      - run: npm run lint
      - run: npm test

      # The browsers do not arrive with `npm ci`, and downloading them is the longest
      # step in this job. Keyed on the lockfile, because that is what decides which
      # version of Playwright is asking for them.
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      # Without this step Playwright fails with "Executable doesn't exist".
      - run: npx playwright install --with-deps chromium

      # BEFORE the deploy build, and that order is load-bearing.
      #
      # `playwright.config.ts` starts its own server with `npm run build && npm run
      # preview`, and that build lands in the same `build/` — with none of the env
      # below, so `BASE_PATH` is empty and `SITE_ORIGIN` falls back to its default.
      # Run after the deploy build, it silently REPLACED it: `check:build` had
      # already passed over the right pages, `upload-pages-artifact` then shipped the
      # wrong ones, and every canonical and every `<loc>` in the sitemap pointed at
      # https://alik532ua.github.io/ — the neighbouring site's root, not this one.
      # 229 pages advertised as 404s, and no gate in this file could see it: each one
      # measured a directory that was correct at the time it looked.
      #
      # The old note here said this run is "unaffected by the one above", which was
      # true and beside the point — the direction that mattered was the other one.
      # `src/ci.test.ts` now holds the invariant instead of the comment: nothing that
      # writes `build/` may sit between the deploy build and the upload.
      - run: npm run test:e2e

      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      # A project site is served from https://<owner>.github.io/<repo>/, a user site
      # from the domain root. Deriving it here keeps the path out of the source.
      - name: Resolve base path
        id: base
        run: |
          if [ "${{ github.event.repository.name }}" = "${{ github.repository_owner }}.github.io" ]; then
            echo "path=" >> "$GITHUB_OUTPUT"
          else
            echo "path=/${{ github.event.repository.name }}" >> "$GITHUB_OUTPUT"
          fi

      # The last step that writes `build/`. Everything after it reads that directory,
      # and the artefact upload ships it.
      - id: build
        run: npm run build
        env:
          BASE_PATH: ${{ steps.base.outputs.path }}
          SITE_ORIGIN: https://${{ github.repository_owner }}.github.io

      # The same base the build used. The checker turns sitemap and canonical URLs
      # back into file paths, and the build directory IS the base — without this it
      # measures against the wrong root and every page looks missing at once.
      - run: npm run check:build
        env:
          BASE_PATH: ${{ steps.base.outputs.path }}

      # PERFORMANCE-v8 § 10.1. Measured from the generated pages, not from the
      # `entry` folder the canon names: in this SvelteKit version that folder holds
      # 2 KB and the application lives in the chunks beside it, so the reference
      # script would report "2 KB of 150" forever.
      - run: npm run check:bundle

      # The only machine check of "a build artefact is not committed"
      # (VERSIONING-v8 § 1.4). It costs a second and it is the difference between
      # noticing a generated file on the first push and finding it months later in
      # every diff, having been re-committed by everyone who ever ran a build.
      - name: The build leaves tracked files alone
        run: git diff --exit-code

      # Version pinned on purpose. `npx @lhci/cli` without one resolves to whatever is
      # latest at the moment the job runs — which is `latest` in a version field, the
      # thing DEPENDENCIES-v8 § 2.3 forbids, only harder to see because it is not in
      # package.json. The thresholds here are score thresholds, so a Lighthouse that
      # scores differently turns the deploy red without a line of this repo changing.
      #
      # Not a devDependency, and that is a decision rather than an oversight: it brings
      # 321 transitive packages (express, inquirer 6, isomorphic-fetch) into every
      # install of a project whose whole runtime is two packages, for a tool that runs
      # once per deploy and never touches the bundle. § 1.1 counts those 321 as 321
      # risks. Recorded in PROJECT-CONTEXT.md § 4.24; bumped as its own commit.
      #
      # `--config` is explicit rather than left to discovery: lhci looks for a list of
      # filenames in order, and a `lighthouserc.json` left behind beside the `.cjs` one
      # would win silently on some versions and not others.
      - name: Lighthouse Audit
        run: npx @lhci/cli@0.15.1 autorun --config=./lighthouserc.cjs

      - uses: actions/upload-pages-artifact@v5
        with:
          path: build

      - id: deployment
        uses: actions/deploy-pages@v5
