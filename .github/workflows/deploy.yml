name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run check
      - run: npm run check:i18n
      - run: npm run lint
      - run: npm test

      # A project site is served from https://<owner>.github.io/<repo>/, a user site
      # from the domain root. Deriving it here keeps the path out of the source.
      - name: Resolve base path
        id: base
        run: |
          if [ "${{ github.event.repository.name }}" = "${{ github.repository_owner }}.github.io" ]; then
            echo "path=" >> "$GITHUB_OUTPUT"
          else
            echo "path=/${{ github.event.repository.name }}" >> "$GITHUB_OUTPUT"
          fi

      - run: npm run build
        env:
          BASE_PATH: ${{ steps.base.outputs.path }}
          SITE_ORIGIN: https://${{ github.repository_owner }}.github.io

      - run: npm run check:build

      # Without this step Playwright fails with "Executable doesn't exist".
      - run: npx playwright install --with-deps chromium

      # Runs against its own fresh build, so it is unaffected by the one above.
      - run: npm run test:e2e

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Lighthouse Audit
        run: npx @lhci/cli autorun

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build

      - id: deployment
        uses: actions/deploy-pages@v5
