<!doctype html>
<html lang="%lang%">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<meta name="color-scheme" content="light dark" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			rel="stylesheet"
			href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@400;500;600;700;800;900&display=swap"
		/>
		%sveltekit.head%
		<script>
			// First-frame theme, before hydration. The theme list and the default must stay
			// in sync with src/lib/services/settings.svelte.ts — a value that is not a real
			// theme leaves the first frame with no palette at all.
			(function () {
				try {
					const THEMES = ['dark', 'light-green', 'orange-purple', 'winter'];
					const DARK = 'dark';
					const LIGHT = 'light-green';
					const saved = localStorage.getItem('adoptananimal_theme');
					const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
					const theme = THEMES.includes(saved) ? saved : prefersDark ? DARK : LIGHT;
					document.documentElement.setAttribute('data-theme', theme);
					const meta = document.querySelector('meta[name="color-scheme"]');
					if (meta) meta.setAttribute('content', theme === DARK ? 'dark' : 'light dark');
				} catch {
					// Storage can be unavailable (private mode, blocked cookies) — the default
					// theme from the stylesheet still applies, so there is nothing to recover.
					document.documentElement.setAttribute('data-theme', 'dark');
				}
			})();
		</script>
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
