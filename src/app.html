<!doctype html>
<html lang="%lang%">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<meta name="color-scheme" content="light dark" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			rel="stylesheet"
			href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@400;500;600;700;800;900&display=swap"
		/>
		%sveltekit.head%
		<script>
			// First frame, before hydration. Both attributes matter, and both lists and
			// defaults must stay in sync with src/lib/services/settings.svelte.ts.
			//
			// data-theme carries the palette: a value that is not a real theme leaves the
			// first frame with no colours at all.
			//
			// data-style carries the shape tokens. Every --radius-* lives under
			// [data-style], so without it border-radius: var(--radius-md) is invalid and
			// every card, button and input renders square until hydration finishes.
			(function () {
				const THEMES = ['dark', 'light-green', 'orange-purple', 'winter'];
				const STYLES = ['modern', 'minimal', 'playful'];
				const DARK = 'dark';
				const LIGHT = 'light-green';
				const root = document.documentElement;

				let theme = DARK;
				let style = 'modern';

				try {
					const savedTheme = localStorage.getItem('adoptananimal_theme');
					const savedStyle = localStorage.getItem('adoptananimal_style');
					const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;

					theme = THEMES.includes(savedTheme) ? savedTheme : prefersDark ? DARK : LIGHT;
					if (STYLES.includes(savedStyle)) style = savedStyle;
				} catch {
					// Storage can be unavailable (private mode, blocked cookies). The defaults
					// above still give a complete first frame, which is the whole point.
				}

				root.setAttribute('data-theme', theme);
				root.setAttribute('data-style', style);

				const meta = document.querySelector('meta[name="color-scheme"]');
				if (meta) meta.setAttribute('content', theme === DARK ? 'dark' : 'light dark');
			})();
		</script>
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
